<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注文端末（シミュレーター用）</title>
<style>
  :root {
    --o:#ff7a45; --ink:#3a2a1e; --mut:#807366; --line:#e5d9cc; --cream:#fff8f0; --peach:#fcefe0; --red:#e03c3c; --err:#b42318;
    --chrome:#1A1A1A; --chrome-2:#2A2E33; --on-chrome:#FFF;
    --card:#FFF; --text:#14161A; --text-2:#565B61; --text-muted:#868C94;
    --bg-raise:#F4F5F7; --bg-inset:#DFE3E7; --border:#C2C7CD; --border-strong:#9098A0; --border-soft:#E2E5E9;
    --ok:#1F7A3E; --warn:#B26A00; --ng:#C0392B; --accent:#2B6CB0;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body { background:var(--cream); color:var(--ink); font:14px/1.4 "Inter","Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; }
  #stage { position:absolute; left:0; top:0; right:0; bottom:24px; overflow:hidden; background:var(--cream); }
  .scr { position:absolute; inset:0; }
  .center { display:flex; flex-direction:column; align-items:center; }

  /* Screen2 */
  .s2 { justify-content:center; }
  .s2 .ttl { margin:0 0 20px; font-size:26px; font-weight:700; }
  .s2 .cards { display:flex; gap:60px; }
  .choice { position:relative; width:340px; height:300px; border-radius:24px; border:2px solid; text-align:center; transition:transform .15s, box-shadow .15s; }
  .choice:hover { transform:translateY(-4px); box-shadow:0 12px 24px rgba(0,0,0,.15); }
  .choice:active { transform:scale(.98); }
  .choice.res { border-color:#4a90e2; background:#edf5ff; } .choice.new { border-color:var(--o); background:#fff4ee; }
  .choice .t { display:block; font-size:44px; font-weight:700; margin-bottom:16px; }
  .choice.res .t { color:#3475bd; } .choice.new .t { color:var(--o); }
  .choice .d { display:block; font-size:18px; margin-bottom:16px; }
  .choice .pill { display:inline-block; border-radius:999px; padding:7px 16px; font-size:15px; font-weight:700; color:#fff; }
  .choice.res .pill { background:#4a90e2; } .choice.new .pill { background:var(--o); }
  .s2 .msg { margin-top:22px; min-height:22px; font-size:16px; font-weight:700; color:var(--err); }

  /* Screen1 */
  .s1 { padding:24px 0; }
  .s1 .ttl { margin:0; font-size:32px; font-weight:700; }
  .s1 .sub { margin:4px 0 12px; font-size:17px; font-weight:600; color:var(--mut); }
  .pbox { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 18px; margin-bottom:12px; border:2px solid var(--line); border-radius:16px; background:#fff; padding:12px 22px; }
  .pbox label { font-size:18px; font-weight:700; }
  .pbox .ctl { display:flex; align-items:center; gap:10px; }
  .pbox .pm { width:44px; height:44px; border:2px solid var(--line); border-radius:12px; background:#fff; font-size:22px; font-weight:700; }
  .pbox .pm:hover { border-color:var(--o); } .pbox .pm:active { transform:scale(.95); }
  .pbox input { width:96px; height:52px; border:2px solid var(--line); border-radius:12px; background:#fff; text-align:center; font:700 24px "Inter","Yu Gothic UI",sans-serif; color:var(--ink); outline:none; }
  .pbox input:focus { border-color:var(--o); } .pbox input.bad { border-color:#e03c3c; }
  .pbox .unit { font-size:17px; font-weight:600; color:var(--mut); }
  .pbox .hint { font-size:15px; font-weight:600; color:var(--mut); margin:0; }
  .pbox .perr { width:100%; text-align:center; font-size:15px; font-weight:700; color:var(--err); margin:0; }
  .legend { display:flex; gap:24px; margin-bottom:14px; }
  .legend span { display:flex; align-items:center; gap:8px; font-size:17px; font-weight:600; }
  .legend i { width:22px; height:22px; border-radius:6px; display:inline-block; }
  .seats { display:grid; grid-template-columns:repeat(8,118px); gap:16px; }
  .seat { height:104px; border-radius:18px; border:2px solid var(--line); background:#fff; color:var(--ink); transition:transform .15s; }
  .seat:hover { transform:translateY(-4px); border-color:var(--o); }
  .seat:active { transform:scale(.95); }
  .seat b { display:block; font-size:32px; } .seat small { display:block; margin-top:4px; font-size:14px; font-weight:600; }
  .seat.on { background:var(--o); border-color:var(--o); color:#fff; box-shadow:0 8px 16px rgba(0,0,0,.2); }
  .s1 .foot { margin-top:18px; display:flex; align-items:center; gap:22px; }
  .s1 .foot p { margin:0; min-width:270px; text-align:right; font-size:19px; font-weight:700; }
  .bigbtn { border:0; border-radius:16px; background:var(--o); color:#fff; padding:16px 42px; font-size:21px; font-weight:700; box-shadow:0 8px 16px rgba(0,0,0,.2); }
  .bigbtn:hover { opacity:.8; } .bigbtn:active { transform:scale(.95); } .bigbtn:disabled { opacity:.45; cursor:not-allowed; }
  .s1 .alert { margin:8px 0 0; font-size:16px; font-weight:700; color:var(--err); min-height:22px; }

  /* Screen6 / 9 */
  .s6 { display:flex; background:var(--cream); }
  .menu-pane { width:66.667%; height:100%; min-height:0; background:#fff; display:flex; flex-direction:column; padding:28px 20px 20px 32px; }
  .menu-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .menu-head p { margin:0; font-size:26px; font-weight:700; }
  .langs { display:flex; gap:6px; }
  .lang { border-radius:8px; padding:6px 10px; font-size:11px; font-weight:600; border:1.2px solid var(--line); background:#fff; color:var(--ink); }
  .lang.on { background:var(--o); border-color:var(--o); color:#fff; }
  .chips { display:flex; gap:8px; margin-bottom:8px; padding-bottom:8px; overflow-x:auto; flex:none; }
  .chip { flex:none; height:40px; min-width:90px; padding:0 16px; border-radius:999px; border:1px solid var(--line); background:var(--cream); font-size:14px; font-weight:700; color:var(--ink); }
  .chip.on { background:var(--o); border-color:var(--o); color:#fff; }
  .grid-wrap { margin-top:10px; flex:1; min-height:0; overflow-x:auto; overflow-y:hidden; padding-bottom:8px; }
  .grid { display:grid; height:100%; width:max-content; grid-auto-flow:column; grid-template-rows:1fr 1fr; gap:16px 20px; padding-right:8px; }
  .card { width:190px; height:100%; min-height:0; border-radius:18px; border:2px solid var(--line); background:#fff; text-align:left; padding:14px; overflow:hidden; transition:transform .15s, box-shadow .15s; }
  .card:hover { transform:translateY(-4px); box-shadow:0 10px 20px rgba(0,0,0,.14); }
  .card .ph { aspect-ratio:3/4; width:100%; max-width:150px; max-height:calc(100% - 64px); margin:0 auto 8px; border-radius:12px; background:var(--peach); display:flex; align-items:center; justify-content:center; color:#d9c3a8; font-size:12px; }
  .card .nm { display:block; font-size:18px; font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:8px; }
  .card .pr { display:block; font-size:16px; color:var(--o); }
  .cart-pane { width:33.333%; height:100%; min-width:0; display:flex; flex-direction:column; background:#fff; border-left:2px solid var(--line); }
  .cart-body { flex:1; overflow-y:auto; padding:28px 24px 0; display:flex; flex-direction:column; gap:14px; }
  .cart-body > p { margin:0; font-size:22px; font-weight:700; }
  .ctx { font-weight:700; margin:0; }
  .linkbtn { margin-top:8px; border:1px solid #888; border-radius:8px; background:#fff; padding:8px 12px; font-size:14px; }
  .cl { border-bottom:1px solid var(--line); padding:10px 0; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .cl .l { min-width:0; display:flex; flex-direction:column; gap:2px; }
  .cl .l b { font-size:16px; font-weight:600; } .cl .l span { font-size:13px; color:var(--mut); } .cl .l em { font-style:normal; font-size:12px; line-height:1.3; color:var(--mut); }
  .cl .l button { align-self:flex-start; margin-top:8px; border:1px solid #888; border-radius:8px; background:#fff; padding:8px 12px; font-size:14px; }
  .cl .pr { flex:none; font-size:17px; font-weight:600; color:var(--o); }
  .cart-foot { background:var(--peach); padding:20px 24px 28px; display:flex; flex-direction:column; gap:16px; }
  .cart-foot .err { margin:0; border:1px solid var(--red); border-radius:10px; background:#fff; padding:10px 12px; font-size:14px; font-weight:600; color:var(--err); }
  .total { display:flex; align-items:center; justify-content:space-between; }
  .total span { font-size:20px; font-weight:600; } .total b { font-size:28px; color:var(--o); }
  .confirm { height:64px; border:0; border-radius:16px; background:var(--o); color:#fff; font-size:20px; font-weight:700; width:100%; }
  .confirm:hover { opacity:.8; } .confirm:active { transform:scale(.97); } .confirm:disabled { opacity:.5; cursor:not-allowed; }

  .s9 .head { position:absolute; left:40px; top:30px; }
  .s9 .head p { margin:0; } .s9 .head .t { font-size:26px; font-weight:700; } .s9 .head .s { margin-top:4px; font-size:13px; font-weight:600; color:var(--mut); }
  .s9 .right { position:absolute; right:40px; top:26px; z-index:10; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .s9 .chips { position:absolute; left:40px; right:40px; top:96px; z-index:10; }
  .s9 .chip { background:#fff; } .s9 .chip.on { background:var(--o); }
  .s9 .grid-wrap { position:absolute; left:40px; right:40px; top:150px; bottom:40px; margin:0; padding-bottom:20px; }
  .s9 .grid { height:550px; gap:24px; padding-right:24px; }
  .s9 .card { width:180px; height:260px; padding:12px; }
  .s9 .card .ph { max-width:120px; max-height:none; }
  .nextbtn { border:0; border-radius:12px; background:var(--ink); color:#fff; padding:10px 18px; font-size:15px; font-weight:700; }
  .nextbtn:hover { opacity:.85; }
  .ordstat { max-width:420px; border-radius:10px; border:1px solid var(--line); background:#fff; padding:6px 12px; font-size:13px; font-weight:600; text-align:right; }
  .ordstat.ok { border-color:#7cc08f; color:var(--ok); } .ordstat.ng { border-color:var(--red); color:var(--err); }

  /* Screen7 modal */
  #modal { position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; padding:48px; }
  #modal.on { display:flex; }
  .mpanel { position:relative; display:flex; height:min(90%,760px); width:min(1100px,calc(100% - 150px)); border-radius:24px; overflow:hidden; background:#f5e8d9; box-shadow:0 25px 50px rgba(0,0,0,.4); }
  .arrow { position:absolute; top:50%; transform:translateY(-50%); z-index:21; width:58px; height:58px; border:0; border-radius:50%; background:rgba(255,255,255,.9); font-size:42px; font-weight:300; line-height:1; box-shadow:0 8px 16px rgba(0,0,0,.25); }
  .arrow:disabled { opacity:.3; cursor:default; } .arrow.l { left:18px; } .arrow.r { right:18px; }
  .mclose { position:absolute; right:18px; top:18px; z-index:30; width:44px; height:44px; border-radius:50%; border:2px solid var(--line); background:#fff; font-size:28px; font-weight:700; line-height:1; }
  .mleft { width:58%; height:100%; padding:28px; display:flex; flex-direction:column; justify-content:center; gap:16px; overflow-y:auto; background:#f5e8d9; }
  .mvideo { margin:0 auto; aspect-ratio:3/4; height:min(53%,420px); border-radius:18px; background:#26211f; display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; font-weight:600; flex:none; }
  .mleft h3 { margin:0; font-size:34px; font-weight:700; }
  .allergy { background:#fff; border:2px solid var(--line); border-radius:14px; padding:16px; }
  .allergy b { display:block; margin-bottom:8px; font-size:16px; font-weight:600; color:var(--red); } .allergy span { font-size:14px; color:var(--mut); }
  .mright { width:42%; height:100%; background:#fff; padding:76px 32px 32px; display:flex; flex-direction:column; overflow-y:auto; }
  .mright h4 { margin:0 0 22px; font-size:22px; font-weight:700; }
  .qrow { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
  .qrow span { font-size:20px; font-weight:600; } .qrow div { display:flex; align-items:center; gap:16px; } .qrow strong { width:28px; text-align:center; font-size:22px; }
  .qbtn { width:48px; height:48px; border:0; border-radius:24px; background:var(--o); color:#fff; font-size:24px; font-weight:700; }
  .og { border-top:1px solid var(--line); padding-top:16px; margin-bottom:24px; display:flex; flex-direction:column; gap:12px; }
  .og .gh { display:flex; align-items:center; gap:8px; } .og .gh b { font-size:19px; font-weight:600; }
  .og .tag { border-radius:999px; padding:2px 8px; font-size:11px; font-weight:700; background:#f0f0f0; color:#6f6055; } .og .tag.req { background:#fff0e8; color:#c65322; }
  .og .cs { display:flex; flex-wrap:wrap; gap:8px; }
  .ch { border-radius:10px; border:2px solid var(--line); background:#fff; color:#6f6055; padding:8px 12px; font-size:15px; font-weight:700; }
  .ch:hover { background:var(--peach); } .ch.on { background:var(--o); border-color:var(--o); color:#fff; }
  .mfoot { margin-top:auto; padding-top:28px; display:flex; flex-direction:column; gap:20px; }
  .mfoot p { margin:0; font-size:24px; font-weight:700; }
  .mfoot .add { border:0; border-radius:16px; background:var(--o); color:#fff; padding:18px; font-size:20px; font-weight:700; }
  .mfoot .add:hover { opacity:.8; } .mfoot .add:disabled { opacity:.45; cursor:not-allowed; }

  /* 開発ドロワー */
  #devbtn { position:absolute; right:4px; top:3px; z-index:40; height:20px; padding:0 10px; border:1px solid rgba(0,0,0,.35); border-radius:10px; background:rgba(26,26,26,.82); color:#fff; font-size:11px; }
  #drawer { position:absolute; right:0; top:0; bottom:24px; width:380px; max-width:100%; z-index:39; background:var(--bg-raise); border-left:1px solid var(--border-strong); box-shadow:-6px 0 16px rgba(0,0,0,.25); overflow-y:auto; padding:30px 8px 8px; display:none; font-size:13px; }
  #drawer.on { display:block; }
  #drawer section { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:8px; margin-bottom:8px; }
  #drawer h2 { margin:0 0 6px; font-size:13px; color:var(--text-2); }
  #drawer button { font:inherit; padding:6px 10px; border:1px solid var(--border-strong); border-radius:4px; background:var(--bg-raise); }
  #drawer button.primary { background:var(--chrome); color:#fff; border-color:var(--chrome); font-weight:bold; }
  #drawer button.danger { color:var(--ng); border-color:var(--ng); }
  #drawer button.sm { padding:2px 8px; font-size:12px; }
  #drawer button:disabled { opacity:.45; cursor:default; }
  #drawer select { font:inherit; padding:5px 6px; border:1px solid var(--border-strong); border-radius:4px; background:#fff; min-width:0; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .qty { min-width:22px; text-align:center; font-weight:bold; }
  .empty { color:var(--text-muted); font-size:12px; }
  .order { border:1px solid var(--border); border-radius:5px; padding:6px; margin-bottom:6px; background:var(--bg-raise); }
  .order.cancelled { opacity:.6; }
  .oid { font:11px ui-monospace,Consolas,monospace; color:var(--text-2); word-break:break-all; }
  .badge { display:inline-block; padding:0 7px; border-radius:9px; font-size:11px; font-weight:bold; color:#fff; }
  .st-sending { background:var(--accent); } .st-sent { background:var(--ok); }
  .st-pending { background:var(--warn); } .st-failed,.st-needs_review { background:var(--ng); }
  .st-cancelled { background:var(--text-muted); }
  .resp { font-size:11px; color:var(--text-2); }
  .items { font-size:12px; margin:4px 0; }
  .derr { color:var(--ng); font-size:11px; }
  .note { font-size:11px; color:var(--text-muted); margin:4px 0 0; }
  #lastComm { position:absolute; left:0; right:0; bottom:0; height:24px; z-index:41; background:var(--chrome-2); color:var(--on-chrome); font:11px/24px ui-monospace,Consolas,monospace; padding:0 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="modal"></div>
<button id="devbtn" type="button">開発</button>
<aside id="drawer">
  <section>
    <h2>送信済みの注文</h2>
    <div id="orders"><span class="empty">まだ注文はありません</span></div>
    <p class="note">「更新」は order-client が同じ orderId の内容変更を許さないため、fetch で直接 POST /api/orders します（サーバーは order.updated を配信）。</p>
  </section>
  <section>
    <h2>不正な注文を送る（サーバーの 400 を見る）</h2>
    <div class="row">
      <select id="badKind">
        <option value="noItems">品目が空</option>
        <option value="badQty">数量が 0</option>
        <option value="bigQty">数量が 100</option>
        <option value="longTable">卓番が長すぎる（7文字）</option>
        <option value="noName">品名が空</option>
        <option value="longNote">メモが 201 文字</option>
        <option value="badPeople">人数が 100</option>
        <option value="badDate">orderedAt が不正</option>
      </select>
      <button id="sendBad" class="danger" type="button">不正注文を送る</button>
    </div>
    <div id="badResult" class="resp" style="margin-top:4px"></div>
  </section>
</aside>
<div id="lastComm">（通信待ち）</div>
<script src="/order-client.js"></script>
<script>
(function () {
  "use strict";
  /* 本物の注文端末は /menus（PostgreSQL）から取るが、シミュレーターには無いので固定データで持つ */
  var CATS = [{ id: "set", name: "御膳" }, { id: "side", name: "一品" }, { id: "rice", name: "ごはん" }, { id: "drink", name: "ドリンク" }];
  var RICE = { name: "ご飯", req: true, multi: false, choices: [{ name: "普通", price: 0 }, { name: "大盛り", price: 100 }] };
  var TOP = { name: "トッピング", req: false, multi: true, choices: [{ name: "温泉卵", price: 100 }, { name: "追い出汁", price: 80 }] };
  var MENU = [
    { id: "m1", cat: "set", name: "土鍋御膳", price: 1480, opts: [RICE, TOP] },
    { id: "m2", cat: "set", name: "うなぎ土鍋御膳", price: 2480, opts: [RICE, TOP] },
    { id: "m3", cat: "set", name: "山城牛の焼きすき土鍋御膳", price: 2980, opts: [RICE, TOP] },
    { id: "m4", cat: "side", name: "海老天ぷら", price: 880, opts: [{ name: "お付けするもの", req: true, multi: false, choices: [{ name: "塩", price: 0 }, { name: "天つゆ", price: 0 }] }] },
    { id: "m5", cat: "side", name: "山城牛のとろ煮", price: 780, opts: [] },
    { id: "m6", cat: "rice", name: "卵かけご飯セット", price: 580, opts: [] },
    { id: "m7", cat: "rice", name: "出汁米1合", price: 400, opts: [] },
    { id: "m8", cat: "drink", name: "ウーロン茶", price: 300, opts: [] },
    { id: "m9", cat: "drink", name: "生ビール", price: 590, opts: [{ name: "サイズ", req: true, multi: false, choices: [{ name: "中ジョッキ", price: 0 }, { name: "大ジョッキ", price: 200 }] }] },
    { id: "m10", cat: "drink", name: "レモンサワー", price: 490, opts: [] },
    { id: "m11", cat: "drink", name: "ハイボール（角）", price: 490, opts: [{ name: "濃さ", req: true, multi: false, choices: [{ name: "普通", price: 0 }, { name: "濃いめ", price: 50 }] }] },
    { id: "m12", cat: "drink", name: "サイダー", price: 350, opts: [] }
  ];
  var LANGS = ["日本語", "English", "繁體中文", "简体中文"];

  /* S: 端末の状態。scr は本物 App.tsx の currentScreen（2/1/6/9）に対応。詳細(7/10)は #modal */
  var S = { scr: 2, msg: "", tables: [], sel: [], peopleText: "", people: null, cat: "all", cart: [], err: "",
            busy: false, detail: null, detailView: false, dqty: 1, dsel: {}, lastOrderId: null, lastTable: "" };
  var ui = {};              // 開発ドロワー用: orderId -> {payload, serverStatus, cancelled, editing, msg}
  var lastStatus = {};      // orderId -> 直近の HTTP ステータス（fetch ラッパーで記録）
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function yen(n) { return "¥" + n.toLocaleString("ja-JP"); }
  function showComm(text) { $("lastComm").textContent = text; }
  function findMenu(id) { return MENU.filter(function (m) { return m.id === id; })[0] || null; }
  function parsePeople(v) {
    v = String(v).trim();
    if (!/^\d{1,2}$/.test(v)) return null;
    var n = parseInt(v, 10);
    return n >= 1 && n <= 99 ? n : null;
  }

  /* 本物の order-client の fetch を包み、HTTP ステータス(201/200)を画面に出す。order-client 本体は無改造 */
  function tappedFetch(url, init) {
    var oid = null;
    try { oid = JSON.parse(init.body).orderId; } catch (_) {}
    return fetch(url, init).then(function (res) {
      if (oid) { lastStatus[oid] = res.status; }
      showComm(init.method + " /api/orders → " + res.status + (oid ? "  (" + oid + ")" : ""));
      return res;
    }, function (err) {
      showComm(init.method + " /api/orders → 通信失敗 (" + err.message + ")");
      throw err;
    });
  }

  var client = window.OrderClient.create({
    endpoint: "/api/orders",
    fetch: tappedFetch,
    onChange: onRecord,
    onError: function (e) { showComm("order-client エラー: " + e.message); }
  });

  function onRecord(rec) {
    var u = ui[rec.orderId] || (ui[rec.orderId] = { payload: rec.payload });
    u.rec = rec;
    if (!u.editing) u.payload = u.payload || rec.payload;
    if (lastStatus[rec.orderId] != null) u.serverStatus = lastStatus[rec.orderId];
    renderOrders();
    refreshOrdStat();
  }

  /* ---------------- 端末 GUI ---------------- */

    else if (S.scr === 6) h = viewMenu(false);
    else if (S.scr === 9) h = viewMenu(true);
    stage.innerHTML = h;
    var gw = stage.querySelector(".grid-wrap");
    if (gw) gw.scrollLeft = sx;
    if (S.scr === 1) refreshS1();
    if (S.scr === 9) refreshOrdStat();
  }
  function go(scr) { S.scr = scr; S.msg = ""; render(); }

  /* Screen6（注文）/ Screen9（注文後の閲覧専用）: メニュー一覧 */
  function visibleMenus() { return S.cat === "all" ? MENU : MENU.filter(function (m) { return m.cat === S.cat; }); }
  function chipsHtml() {
    return '<div class="chips"><button type="button" class="chip' + (S.cat === "all" ? " on" : "") + '" data-cat="all">すべて</button>' +
      CATS.map(function (c) {
        return '<button type="button" class="chip' + (S.cat === c.id ? " on" : "") + '" data-cat="' + esc(c.id) + '">' + esc(c.name) + "</button>";
      }).join("") + "</div>";
  }
  function cardsHtml() {
    return '<div class="grid-wrap"><div class="grid">' + visibleMenus().map(function (m) {
      return '<button type="button" class="card" data-menu="' + esc(m.id) + '"><div class="ph">画像</div><span class="nm">' + esc(m.name) +
        '</span><span class="pr">' + yen(m.price) + "</span></button>";
    }).join("") + "</div></div>";
  }
  function langsHtml() {
    return '<div class="langs">' + LANGS.map(function (l, i) {
      return '<button type="button" class="lang' + (i === 0 ? " on" : "") + '" data-act="lang">' + esc(l) + "</button>";
    }).join("") + "</div>";
  }
  function optText(line) {
    var groups = [], map = {};
    line.sel.forEach(function (s) {
      if (!map[s.group]) { map[s.group] = []; groups.push(s.group); }
      map[s.group].push(s.choice);
    });
    return groups.map(function (g) { return g + "：" + map[g].join("・"); });
  }
  function viewMenu(viewOnly) {
    if (viewOnly) {
      return '<div class="scr s9"><div class="head"><p class="t">メニュー一覧（閲覧専用）</p><p class="s">追加注文はできません</p></div>' +
        '<div class="right">' + langsHtml() + '<button type="button" class="nextbtn" data-act="next">次のお客様（最初に戻る）</button>' +
        '<div class="ordstat" id="ordstat"></div></div>' + chipsHtml() + cardsHtml() + "</div>";
    }
    var total = S.cart.reduce(function (s, l) { return s + l.unit * l.qty; }, 0);
    var lines = S.cart.map(function (l, i) {
      var ot = optText(l).join(" ／ ");
      return '<div class="cl"><div class="l"><b>' + esc(l.name) + "</b><span>数量：" + l.qty + "</span>" +
        (ot ? "<em>" + esc(ot) + "</em>" : "") +
        '<button type="button" data-rm="' + i + '"' + (S.busy ? " disabled" : "") + ' aria-label="' + esc(l.name) + 'をカートから削除">削除</button></div>' +
        '<div class="pr">' + yen(l.unit * l.qty) + "</div></div>";
    }).join("");
    return '<div class="scr s6"><div class="menu-pane"><div class="menu-head"><p>メニュー一覧</p>' + langsHtml() + "</div>" +
      chipsHtml() + cardsHtml() + '</div><div class="cart-pane"><div class="cart-body"><p>ご注文内容</p>' +
      '<div><p class="ctx">卓 ' + esc(S.tables.join("・")) + " ／ " + esc(S.people == null ? "未入力" : S.people) + '名</p>' +
      '<button type="button" class="linkbtn" data-act="review">卓・人数を変更</button></div>' + lines + "</div>" +
      '<div class="cart-foot">' + (S.err ? '<p class="err" role="alert">' + esc(S.err) + "</p>" : "") +
      '<div class="total"><span>合計金額</span><b>' + yen(total) + '</b></div>' +
      '<button type="button" class="confirm" data-act="confirm"' + (S.cart.length === 0 || S.busy ? " disabled" : "") + ">" +
      (S.busy ? "送信中…" : "確定（キッチンへ送信）") + "</button></div></div></div>";
  }
  function refreshOrdStat() {
    var el = $("ordstat"); if (!el) return;
    var u = ui[S.lastOrderId], r = u && u.rec;
    if (!r) { el.textContent = "送信中…"; el.className = "ordstat"; return; }
    var txt = { sent: "ご注文を受け付けました", sending: "送信中…", pending: "送信できませんでした。自動で再送します", failed: "送信に失敗しました", needs_review: "要確認：スタッフにお声がけください" }[r.status] || r.status;
    el.textContent = "卓 " + S.lastTable + "：" + txt;
    el.className = "ordstat " + (r.status === "sent" ? "ok" : (r.status === "failed" || r.status === "needs_review" ? "ng" : ""));
  }

  /* Screen7 / 10: メニュー詳細（#modal） */
  function openDetail(id, viewOnly) {
    S.detail = id; S.detailView = viewOnly; S.dqty = 1; S.dsel = {};
    var m = findMenu(id);
    m.opts.forEach(function (g, gi) { S.dsel[gi] = g.req ? [0] : []; });
    renderDetail();
  }
  function closeDetail() { S.detail = null; $("modal").className = ""; $("modal").innerHTML = ""; }
  function detailPicked(m) {
    var out = [];
    m.opts.forEach(function (g, gi) {
      (S.dsel[gi] || []).forEach(function (ci) { out.push({ group: g.name, choice: g.choices[ci].name, price: g.choices[ci].price }); });
    });
    return out;
  }
  function renderDetail() {
    var m = findMenu(S.detail); if (!m) return closeDetail();
    var ids = visibleMenus().map(function (x) { return x.id; }), at = ids.indexOf(m.id);
    var picked = detailPicked(m), unit = m.price + picked.reduce(function (s, p) { return s + p.price; }, 0);
    var complete = m.opts.every(function (g, gi) { return !g.req || (S.dsel[gi] || []).length > 0; });
    var groups = m.opts.map(function (g, gi) {
      return '<div class="og"><div class="gh"><b>' + esc(g.name) + '</b><span class="tag' + (g.req ? " req" : "") + '">' + (g.req ? "必須" : "任意") + '</span></div><div class="cs">' +
        g.choices.map(function (c, ci) {
          var on = (S.dsel[gi] || []).indexOf(ci) >= 0;
          return '<button type="button" class="ch' + (on ? " on" : "") + '" data-g="' + gi + '" data-c="' + ci + '" aria-pressed="' + on + '">' +
            esc(c.name) + (c.price > 0 ? " ＋" + yen(c.price) : "") + "</button>";
        }).join("") + "</div></div>";
    }).join("");
    var right = S.detailView
      ? '<h4>' + esc(yen(m.price)) + '</h4><p style="color:#807366;margin:0">追加注文はできません（閲覧専用）</p>' + groups.replace(/<button /g, "<button disabled ")
      : '<h4>オプションを選択してください</h4><div class="qrow"><span>注文数（個）</span><div><button type="button" class="qbtn" data-act="qminus">−</button><strong>' + S.dqty +
        '</strong><button type="button" class="qbtn" data-act="qplus">+</button></div></div>' + groups +
        '<div class="mfoot"><p>金額：' + yen(unit * S.dqty) + '</p><button type="button" class="add" data-act="dadd"' + (complete ? "" : " disabled") + ">注文する（カートに追加）</button></div>";
    $("modal").className = "on";
    $("modal").innerHTML = '<button type="button" class="arrow l" data-act="dprev"' + (at > 0 ? "" : " disabled") + ' aria-label="前の商品">‹</button>' +
      '<div class="mpanel"><button type="button" class="mclose" data-act="dclose" aria-label="戻る">×</button>' +
      '<div class="mleft"><div class="mvideo">▶ 動画・商品画像</div><h3>' + esc(m.name) + '</h3><div class="allergy"><b>アレルギー表示</b><span>－</span></div></div>' +
      '<div class="mright">' + right + "</div></div>" +
      '<button type="button" class="arrow r" data-act="dnext"' + (at < ids.length - 1 ? "" : " disabled") + ' aria-label="次の商品">›</button>';
  }
  $("modal").addEventListener("click", function (e) {
    if (e.target === $("modal")) return closeDetail();
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    var m = findMenu(S.detail), act = b.getAttribute("data-act");
    if (b.hasAttribute("data-g")) {
      var gi = +b.getAttribute("data-g"), ci = +b.getAttribute("data-c"), g = m.opts[gi], cur = S.dsel[gi] || [], at = cur.indexOf(ci);
      if (!g.multi) S.dsel[gi] = (!g.req && at >= 0) ? [] : [ci];
      else if (at >= 0) { if (!(g.req && cur.length === 1)) S.dsel[gi] = cur.filter(function (x) { return x !== ci; }); }
      else S.dsel[gi] = cur.concat([ci]);
      return renderDetail();
    }
    if (act === "dclose") closeDetail();
    else if (act === "qminus") { S.dqty = Math.max(1, S.dqty - 1); renderDetail(); }
    else if (act === "qplus") { S.dqty = Math.min(99, S.dqty + 1); renderDetail(); }
    else if (act === "dprev" || act === "dnext") {
      var ids = visibleMenus().map(function (x) { return x.id; }), to = ids[ids.indexOf(m.id) + (act === "dnext" ? 1 : -1)];
      if (to) openDetail(to, S.detailView);
    } else if (act === "dadd") {
      var picked = detailPicked(m);
      S.cart.push({ id: m.id, name: m.name, qty: S.dqty, sel: picked, unit: m.price + picked.reduce(function (s, p) { return s + p.price; }, 0) });
      S.err = ""; closeDetail(); render();
    }
  });

  /* 端末内クリックの振り分け */
  stage.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    var act = b.getAttribute("data-act");
    if (b.hasAttribute("data-seat")) {
      var s = b.getAttribute("data-seat"), at = S.sel.indexOf(s);
      if (at >= 0) S.sel.splice(at, 1); else S.sel.push(s);
      return render();
    }
    if (b.hasAttribute("data-cat")) { S.cat = b.getAttribute("data-cat"); return render(); }
    if (b.hasAttribute("data-menu")) return openDetail(b.getAttribute("data-menu"), S.scr === 9);
    if (b.hasAttribute("data-rm")) { S.cart.splice(+b.getAttribute("data-rm"), 1); S.err = ""; return render(); }
    if (act === "reserve") { S.msg = "シミュレーターでは新規注文のみ扱えます（予約フローは対象外）"; render(); }
    else if (act === "new") { S.sel = []; S.peopleText = ""; S.people = null; S.cart = []; S.err = ""; go(1); }
    else if (act === "pminus") { S.peopleText = String(Math.max(1, (parsePeople(S.peopleText) || 1) - 1)); render(); }
    else if (act === "pplus") { S.peopleText = String(Math.min(99, (parsePeople(S.peopleText) || 0) + 1)); render(); }
    else if (act === "s1done") { S.tables = S.sel.slice(); S.people = parsePeople(S.peopleText); S.cat = "all"; go(6); }
    else if (act === "review") go(1);
    else if (act === "confirm") confirmOrder();
    else if (act === "next") { S.cart = []; S.tables = []; S.sel = []; S.cat = "all"; S.lastOrderId = null; closeDetail(); go(2); }
  });
  stage.addEventListener("input", function (e) {
    if (e.target.id === "people") { S.peopleText = e.target.value; refreshS1(); }
  });

  /* ---- 送信（order-client 経由）。payload は中継サーバーの形式 ---- */
  function cartPayloadItems() {
    return S.cart.map(function (l, i) {
      var note = optText(l).join(" / ");
      if (i === 0 && S.tables.length > 1) note = (note ? note + " / " : "") + "合卓：" + S.tables.join("・");
      var it = { name: l.name, qty: l.qty };
      if (note) it.note = note.slice(0, 200);
      return it;
    });
  }
  function confirmOrder() {
    if (S.busy || !S.cart.length) return;
    var table = S.tables[0];
    var payload = {
      orderId: "T" + table + "-" + Date.now().toString(36),
      table: table,
      people: S.people == null ? 0 : S.people,
      items: cartPayloadItems()
    };
    S.busy = true; S.err = ""; render();
    client.submit(payload).then(function (id) {
      ui[id] = ui[id] || {}; ui[id].payload = payload;
      S.busy = false; S.cart = []; S.lastOrderId = id; S.lastTable = table;
      showComm("order-client.submit → 送信キューに追加 (" + id + ")");
      go(9);
    }, function (e) { S.busy = false; S.err = e.message || "注文の送信に失敗しました。"; render(); });
  }

  /* ---------------- 開発ドロワー ---------------- */
  $("devbtn").addEventListener("click", function () {
    var d = $("drawer"); d.className = d.className === "on" ? "" : "on";
    $("devbtn").textContent = d.className === "on" ? "閉じる" : "開発";
  });

  /* ---- 送信済み一覧 ---- */
  var STATUS = { pending: "再送待ち", sending: "送信中", sent: "受付済み", failed: "失敗", needs_review: "要確認" };
  function respLabel(code) {
    if (code === 201) return "201 新規";
    if (code === 200) return "200 重複・更新";
    return code == null ? "—" : String(code);
  }
  function renderOrders() {
    var ids = Object.keys(ui).filter(function (id) { return ui[id].rec; });
    ids.sort(function (a, b) { return ui[b].rec.createdAt - ui[a].rec.createdAt; });
    if (!ids.length) { $("orders").innerHTML = '<span class="empty">まだ注文はありません</span>'; return; }
    $("orders").innerHTML = ids.map(function (id) {
      var u = ui[id], r = u.rec, p = u.payload || r.payload;
      var st = u.cancelled ? "cancelled" : r.status;
      var label = u.cancelled ? "取消済み" : (STATUS[r.status] || r.status);
      var html = '<div class="order' + (u.cancelled ? " cancelled" : "") + '"><div class="row">' +
        '<span class="badge st-' + esc(st) + '">' + esc(label) + "</span><b>卓 " + esc(p.table) + "</b>" +
        '<span class="resp">' + esc(p.people) + "名 / 応答 " + esc(respLabel(u.serverStatus)) + "</span></div>" +
        '<div class="oid">' + esc(id) + "</div>";
      if (r.retryCount) html += '<div class="resp">再送回数 ' + esc(r.retryCount) + "</div>";
      if (r.error) html += '<div class="derr">' + esc(r.error) + "</div>";
      if (u.msg) html += '<div class="resp">' + esc(u.msg) + "</div>";
      if (u.editing) {
        html += u.editing.map(function (l, i) {
          return '<div class="row items"><span style="flex:1">' + esc(l.name) + "</span>" +
            '<button class="sm" data-edec="' + esc(id) + "|" + i + '">−</button><span class="qty">' + l.qty + "</span>" +
            '<button class="sm" data-einc="' + esc(id) + "|" + i + '">＋</button></div>';
        }).join("") +
          '<div class="row"><button class="primary sm" data-doupd="' + esc(id) + '">更新を送信</button>' +
          '<button class="sm" data-canceledit="' + esc(id) + '">やめる</button></div>';
      } else {
        html += '<div class="items">' + p.items.map(function (l) {
          return esc(l.name) + " ×" + esc(l.qty) + (l.note ? "（" + esc(l.note) + "）" : "") +
            (l.allergies ? " ⚠" + esc(l.allergies) : "");
        }).join("<br>") + "</div>";
        var canAct = !u.cancelled && r.status !== "pending" && r.status !== "sending";
        html += '<div class="row"><button class="sm" data-edit="' + esc(id) + '"' + (canAct ? "" : " disabled") + ">数量を変えて更新</button>" +
          '<button class="sm danger" data-cancel="' + esc(id) + '"' + (canAct ? "" : " disabled") + ">取消</button></div>";
      }
      return html + "</div>";
    }).join("");
  }

  $("orders").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var a = function (n) { return b.getAttribute(n); };
    var id, u;
    if ((id = a("data-edit"))) {
      u = ui[id]; u.editing = JSON.parse(JSON.stringify(u.payload.items)); u.msg = ""; renderOrders();
    } else if ((id = a("data-canceledit"))) {
      ui[id].editing = null; renderOrders();
    } else if (a("data-einc") || a("data-edec")) {
      var v = (a("data-einc") || a("data-edec")).split("|"), line = ui[v[0]].editing[+v[1]];
      line.qty = a("data-einc") ? Math.min(99, line.qty + 1) : Math.max(1, line.qty - 1);
      renderOrders();
    } else if ((id = a("data-doupd"))) {
      doUpdate(id);
    } else if ((id = a("data-cancel"))) {
      doCancel(id);
    }
  });

  function doUpdate(id) {
    var u = ui[id], payload = JSON.parse(JSON.stringify(u.payload));
    payload.items = u.editing;
    fetch("/api/orders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then(function (res) {
        showComm("POST /api/orders → " + res.status + "  (更新 " + id + ")");
        u.serverStatus = res.status;
        if (res.status === 200 || res.status === 201) { u.payload = payload; u.msg = "更新を送信しました"; }
        else u.msg = "更新に失敗 (HTTP " + res.status + ")";
        u.editing = null; renderOrders();
      }, function (err) {
        showComm("POST /api/orders → 通信失敗 (" + err.message + ")");
        u.msg = "更新の通信に失敗: " + err.message; renderOrders();
      });
  }

  function doCancel(id) {
    var u = ui[id];
    fetch("/api/orders/" + encodeURIComponent(id), { method: "DELETE" }).then(function (res) {
      showComm("DELETE /api/orders/" + id + " → " + res.status);
      u.serverStatus = res.status;
      if (res.ok) { u.cancelled = true; u.msg = "取消しました"; }
      else u.msg = "取消に失敗 (HTTP " + res.status + ")";
      renderOrders();
    }, function (err) {
      showComm("DELETE /api/orders/" + id + " → 通信失敗 (" + err.message + ")");
      u.msg = "取消の通信に失敗: " + err.message; renderOrders();
    });
  }

  /* ---- 不正な注文（わざと範囲外を直接 fetch。order-client は経由しない） ---- */
  $("sendBad").addEventListener("click", function () {
    var kind = $("badKind").value;
    var p = { orderId: "BAD-" + Date.now().toString(36), table: "1", people: 2, items: [{ name: "土鍋御膳", qty: 1 }] };
    if (kind === "noItems") p.items = [];
    else if (kind === "badQty") p.items[0].qty = 0;
    else if (kind === "bigQty") p.items[0].qty = 100;
    else if (kind === "longTable") p.table = "1234567";
    else if (kind === "noName") p.items[0].name = "";
    else if (kind === "longNote") p.items[0].note = new Array(202).join("あ");
    else if (kind === "badPeople") p.people = 100;
    else if (kind === "badDate") p.orderedAt = "いつか";
    fetch("/api/orders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(p) })
      .then(function (res) {
        return res.text().then(function (t) {
          showComm("POST /api/orders → " + res.status + "  (不正注文)");
          $("badResult").textContent = "HTTP " + res.status + " " + t.slice(0, 300);
        });
      }, function (err) { $("badResult").textContent = "通信失敗: " + err.message; });
  });

  client.start();
  client.list().then(function (recs) {
    recs.forEach(function (r) { if (!ui[r.orderId]) onRecord(r); });
  }).catch(function (e) { showComm("保存領域を読めません: " + e.message); });
  render();
})();
</script>
</body>
</html>

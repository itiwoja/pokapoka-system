<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{background:var(--surface);padding:64px 32px 24px}
.row{display:grid;grid-template-columns:120px 1fr 110px;align-items:baseline;padding:18px 0;border-top:1px solid var(--line);position:relative}
.row.late::before{content:"";position:absolute;left:-32px;top:0;bottom:0;width:10px;background:var(--text)}
.t{font-size:48px;font-weight:800;line-height:1}
.items{display:flex;flex-wrap:wrap;gap:10px 28px;font-size:24px;font-weight:700}
.items i{font-style:normal;font-size:18px;color:var(--sub);margin-right:6px}
.items small{font-size:17px;font-weight:600;margin-left:6px}
.items .al{color:var(--alert)}
.items .done{color:var(--done);text-decoration:line-through}
.age{text-align:right;font-size:24px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.row.late .age{color:var(--text);font-weight:800}
.k{font-size:16px;color:var(--sub);display:block;font-weight:600;margin-top:4px}
.res .t{font-size:30px;color:var(--gold)}.res .items{font-size:20px;color:var(--sub)}
.hr{margin:28px 0 0;font-size:16px;color:var(--sub);letter-spacing:.2em}
</style></head><body>
<div class="clock">10:43 <span style="font-size:16px;color:var(--sub);font-weight:600;margin-left:20px">6卓 ・ 10分超 6</span></div>
<div class="row late"><div><div class="t">3</div><span class="k">コンロ 1・2</span></div><div class="items"><span><i>2</i>鯛めし<small>大盛り</small></span><span><i>2</i>味噌汁</span><span><i>1</i>だし巻き玉子<small class="al">卵</small></span></div><div class="age">28:21</div></div>
<div class="row late"><div><div class="t">7</div></div><div class="items"><span><i>1</i>鶏めし<small>ごはん少なめ</small></span><span class="done"><i>1</i>サラダ</span></div><div class="age">24:21</div></div>
<div class="row late"><div><div class="t">12</div><span class="k">コンロ 3</span></div><div class="items"><span><i>3</i>牛すき釜飯</span><span><i>3</i>漬物</span></div><div class="age">22:21</div></div>
<div class="row late"><div><div class="t">5</div><span class="k">コンロ 5</span></div><div class="items"><span><i>1</i>海鮮釜飯<small class="al">えび・かに</small></span><span><i>1</i>茶碗蒸し</span></div><div class="age">20:21</div></div>
<div class="row"><div><div class="t">A2</div><span class="k">コンロ 7</span></div><div class="items"><span><i>2</i>きのこ釜飯<small>取り分け皿</small></span><span><i>1</i>唐揚げ</span></div><div class="age">8:21</div></div>
<div class="row"><div><div class="t">9</div></div><div class="items"><span><i>1</i>鯛めし</span><span><i>1</i>デザート<small>先出し</small></span></div><div class="age">1:21</div></div>
<div class="hr">予約</div>
<div class="row res"><div class="t">10:47</div><div class="items"><span>山田 5名</span><span><i>4</i>鯛めし</span><span><i>1</i>お子様セット</span><span class="al">アレルギー: そば</span></div><div class="age">あと4分</div></div>
<div class="row res"><div class="t">11:47</div><div class="items"><span>佐藤 2名</span><span><i>2</i>牛すき釜飯</span></div><div class="age"></div></div>
<div class="row res"><div class="t">12:57</div><div class="items"><span>鈴木 6名</span><span><i>6</i>海鮮釜飯</span></div><div class="age"></div></div>
</body></html>
